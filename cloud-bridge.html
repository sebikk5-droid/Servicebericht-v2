<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Servicebericht Cloud-Brücke</title>
</head>
<body>
<p>Servicebericht Cloud-Brücke. Diese Datei bleibt im WebDAV-Ordner.</p>
<script>
(function(){
  function allowed(origin){
    const o=String(origin||"");
    if(o==="https://sebikk5-droid.github.io") return true;
    if(/^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(o)) return true;
    return false;
  }
  function auth(user, pass){
    const s=String(user||"")+":"+String(pass||"");
    if(s===":") return "";
    try{ return "Basic "+btoa(unescape(encodeURIComponent(s))); }
    catch(e){ return "Basic "+btoa(s); }
  }
  window.addEventListener("message", function(ev){
    if(!allowed(ev.origin)) return;
    const msg=ev.data||{};
    if(!msg || msg.type!=="sb-dav") return;
    const headers={};
    const a=auth(msg.user, msg.pass);
    if(a) headers.Authorization=a;
    if(msg.contentType) headers["Content-Type"]=msg.contentType;
    if(msg.depth!=null) headers.Depth=String(msg.depth);
    const name=String(msg.filename||msg.path||"").replace(/^\/+/, "");
    const url=new URL(name||".", location.href).href;
    fetch(url, {method:msg.method||"PUT", headers:headers, body:msg.body, credentials:"omit", cache:"no-store"})
      .then(function(r){
        const ok=!!(r.ok || r.status===201 || r.status===204 || r.status===207);
        ev.source.postMessage({type:"sb-dav-result", id:msg.id, ok:ok, status:r.status}, ev.origin);
      })
      .catch(function(){
        ev.source.postMessage({type:"sb-dav-result", id:msg.id, ok:false, reason:"network"}, ev.origin);
      });
  });
  try{
    if(window.parent && window.parent!==window)
      window.parent.postMessage({type:"sb-dav-ready"}, "*");
  }catch(e){}
})();
</script>
</body>
</html>
